name: Build Windows GPU binaries

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Backend to build
        required: true
        default: all
        type: choice
        options:
          - all
          - cuda
          - rocm
          - vulkan
      cuda_version:
        description: CUDA Toolkit version (used by CUDA/all)
        required: true
        default: '12.4'
        type: choice
        options:
          - '12.4'
      rocm_version:
        description: ROCm version (used by ROCm/all)
        required: true
        default: '7.14.0'
        type: choice
        options:
          - '7.14.0'
          - '10.0.0'
      vulkan_version:
        description: Vulkan SDK version (used by Vulkan/all)
        required: true
        default: '1.4.357.0'
        type: choice
        options:
          - '1.4.357.0'
      rocm_target:
        description: AMD GPU target (used by ROCm/all)
        required: true
        default: gfx1201
        type: choice
        options:
          - gfx1100
          - gfx1101
          - gfx1150
          - gfx1151
          - gfx1200
          - gfx1201
      llama_source:
        description: llama.cpp source type
        required: true
        default: release
        type: choice
        options:
          - release
          - nightly
          - latest-branch
      llama_tag:
        description: Optional tag (vX.Y.Z for release, bNNNNN for nightly; empty selects latest)
        required: false
        default: ''
        type: string
      publish_release:
        description: Attach successful build ZIPs to a GitHub Release
        required: true
        default: true
        type: boolean
      release_tag:
        description: Optional Release tag (empty generates a unique build tag)
        required: false
        default: ''
        type: string
permissions:
  contents: read

# Toolchain versions selected in Run workflow and used by setup, cache, and artifact names.
# To add a selectable version:
# 1. Add it to the corresponding workflow_dispatch choice above.
# 2. CUDA: verify vendor/llama.cpp/.github/actions/windows-setup-cuda supports it.
# 3. ROCm: verify the version in the legacy 7.14 or stable 10+ package index.
# 4. Vulkan: verify the version exists at https://vulkan.lunarg.com/sdk/home#windows.
# 5. Run the corresponding backend manually and verify its DLL and ZIP artifact.
env:
  CUDA_VERSION: ${{ inputs.cuda_version }}
  ROCM_VERSION: ${{ inputs.rocm_version }}
  # ROCm 10 stable moved to the new TheRock aggregate index; 7.14 remains legacy.
  ROCM_INDEX_URL: ${{ startsWith(inputs.rocm_version, '10.') && 'https://stable.repo.amd.com/rocm/whl-next/' || 'https://repo.amd.com/rocm/whl-multi-arch/' }}
  VULKAN_VERSION: ${{ inputs.vulkan_version }}

concurrency:
  group: windows-gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    if: inputs.backend == 'all' || inputs.backend == 'cuda'
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      llama_ref: ${{ steps.llama-source.outputs.ref }}
    steps:
      - name: Checkout with pinned llama.cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Select llama.cpp source
        id: llama-source
        shell: pwsh
        env:
          LLAMA_SOURCE: ${{ inputs.llama_source }}
          LLAMA_TAG: ${{ inputs.llama_tag }}
        run: |
          $tag = $env:LLAMA_TAG.Trim()
          switch ($env:LLAMA_SOURCE) {
            'release' {
              if ($tag) { ./scripts/Update-LlamaCpp.ps1 -Release $tag }
              else { ./scripts/Update-LlamaCpp.ps1 }
            }
            'nightly' {
              if ($tag) { ./scripts/Update-LlamaCpp.ps1 -Nightly $tag }
              else { ./scripts/Update-LlamaCpp.ps1 -LatestNightly }
            }
            'latest-branch' {
              if ($tag) { throw 'llama_tag must be empty when latest-branch is selected.' }
              ./scripts/Update-LlamaCpp.ps1 -LatestBranch
            }
            default { throw "Unsupported llama_source: $env:LLAMA_SOURCE" }
          }
          $selectedRef = git -C vendor/llama.cpp describe --tags --exact-match HEAD 2>$null
          if (-not $selectedRef) {
            $shortSha = git -C vendor/llama.cpp rev-parse --short=12 HEAD
            $selectedRef = "master-$shortSha"
          }
          "LLAMA_REF=$selectedRef" >> $env:GITHUB_ENV
          "ref=$selectedRef" >> $env:GITHUB_OUTPUT

      - name: Set up CUDA
        uses: ./vendor/llama.cpp/.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ env.CUDA_VERSION }}
          cuda_arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Build CUDA with peer copy disabled
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S vendor/llama.cpp -B build-cuda -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_NO_PEER_COPY=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON
          cmake --build build-cuda --config Release -j %NUMBER_OF_PROCESSORS%

      - name: Verify CUDA backend
        shell: pwsh
        run: |
          if (-not (Test-Path 'build-cuda/bin/Release/ggml-cuda.dll')) {
            throw 'ggml-cuda.dll was not produced.'
          }

      - name: Create CUDA package
        shell: pwsh
        run: ./scripts/Package-Build.ps1 -BuildDir ./build-cuda -Name "llama-${env:LLAMA_REF}-win-x64-cuda-${env:CUDA_VERSION}-no-peer-copy"

      - name: Upload CUDA package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llama-${{ env.LLAMA_REF }}-win-x64-cuda-${{ env.CUDA_VERSION }}-no-peer-copy
          path: dist/*.zip
          if-no-files-found: error

  rocm:
    if: inputs.backend == 'all' || inputs.backend == 'rocm'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      GPU_TARGET: ${{ inputs.rocm_target }}
    outputs:
      llama_ref: ${{ steps.llama-source.outputs.ref }}
    steps:
      - name: Checkout with pinned llama.cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Select llama.cpp source
        id: llama-source
        shell: pwsh
        env:
          LLAMA_SOURCE: ${{ inputs.llama_source }}
          LLAMA_TAG: ${{ inputs.llama_tag }}
        run: |
          $tag = $env:LLAMA_TAG.Trim()
          switch ($env:LLAMA_SOURCE) {
            'release' {
              if ($tag) { ./scripts/Update-LlamaCpp.ps1 -Release $tag }
              else { ./scripts/Update-LlamaCpp.ps1 }
            }
            'nightly' {
              if ($tag) { ./scripts/Update-LlamaCpp.ps1 -Nightly $tag }
              else { ./scripts/Update-LlamaCpp.ps1 -LatestNightly }
            }
            'latest-branch' {
              if ($tag) { throw 'llama_tag must be empty when latest-branch is selected.' }
              ./scripts/Update-LlamaCpp.ps1 -LatestBranch
            }
            default { throw "Unsupported llama_source: $env:LLAMA_SOURCE" }
          }
          $selectedRef = git -C vendor/llama.cpp describe --tags --exact-match HEAD 2>$null
          if (-not $selectedRef) {
            $shortSha = git -C vendor/llama.cpp rev-parse --short=12 HEAD
            $selectedRef = "master-$shortSha"
          }
          "LLAMA_REF=$selectedRef" >> $env:GITHUB_ENV
          "ref=$selectedRef" >> $env:GITHUB_OUTPUT

      - name: Resolve ROCm cache context
        id: rocm-cache-context
        shell: pwsh
        run: |
          $pythonVersion = python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}')"
          "python=$pythonVersion" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore ROCm SDK cache
        id: rocm-sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\TheRock\build
          key: windows-2022-${{ runner.arch }}-${{ steps.rocm-cache-context.outputs.image }}-python-${{ steps.rocm-cache-context.outputs.python }}-rocm-sdk-${{ env.ROCM_VERSION }}-${{ env.GPU_TARGET }}-${{ hashFiles('scripts/Install-Rocm.ps1') }}

      - name: Set up ROCm SDK and device kernels
        if: steps.rocm-sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/Install-Rocm.ps1 -Version $env:ROCM_VERSION -IndexUrl $env:ROCM_INDEX_URL -Target $env:GPU_TARGET

      - name: Export ROCm environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & C:\TheRock\build\.venv\Scripts\Activate.ps1
          rocm-sdk init
          if ($LASTEXITCODE -ne 0) { throw "rocm-sdk init failed: $LASTEXITCODE" }
          $rocmPath = (rocm-sdk path --root).Trim()
          $cmakePath = (rocm-sdk path --cmake).Trim()
          $binPath = (rocm-sdk path --bin).Trim()
          $packageRoot = Join-Path $env:VIRTUAL_ENV 'Lib\site-packages'
          "HIP_PATH=$rocmPath" >> $env:GITHUB_ENV
          "ROCM_PACKAGE_ROOT=$packageRoot" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$cmakePath" >> $env:GITHUB_ENV
          "HIP_DEVICE_LIB_PATH=$rocmPath\lib\llvm\amdgcn\bitcode" >> $env:GITHUB_ENV
          'HIP_PLATFORM=amd' >> $env:GITHUB_ENV
          "LLVM_PATH=$rocmPath\lib\llvm" >> $env:GITHUB_ENV
          $binPath >> $env:GITHUB_PATH
          'C:\TheRock\build\.venv\Scripts' >> $env:GITHUB_PATH

      - name: Restore ROCm build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-rocm
          key: windows-2022-rocm-build-${{ env.ROCM_VERSION }}-${{ env.GPU_TARGET }}-${{ steps.llama-source.outputs.ref }}-${{ hashFiles('.github/workflows/build-windows-gpu.yml', 'scripts/Build-Rocm.ps1') }}

      - name: Build ROCm with peer copy disabled
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S vendor/llama.cpp -B build-rocm -G 'Unix Makefiles' `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=${env:HIP_PATH}" `
            "-DCMAKE_C_COMPILER=${env:HIP_PATH}\lib\llvm\bin\clang.exe" `
            "-DCMAKE_CXX_COMPILER=${env:HIP_PATH}\lib\llvm\bin\clang++.exe" `
            "-DCMAKE_HIP_COMPILER=${env:HIP_PATH}\lib\llvm\bin\clang.exe" `
            "-DHIP_PATH=${env:HIP_PATH}" `
            -DGGML_HIP=ON `
            -DGGML_CUDA_NO_PEER_COPY=ON `
            -DGGML_HIP_NO_VMM=ON `
            -DGGML_HIP_ROCWMMA_FATTN=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_BACKEND_DL=ON `
            -DLLAMA_BUILD_BORINGSSL=ON `
            "-DAMDGPU_TARGETS=${env:GPU_TARGET}"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }
          cmake --build build-rocm --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed: $LASTEXITCODE" }

      - name: Verify ROCm backend
        shell: pwsh
        run: |
          if (-not (Test-Path 'build-rocm/bin/ggml-hip.dll')) {
            throw 'ggml-hip.dll was not produced.'
          }
          $configuredTarget = Select-String -Path 'build-rocm/CMakeCache.txt' -Pattern "AMDGPU_TARGETS:.*=${env:GPU_TARGET}$"
          if (-not $configuredTarget) {
            throw "ROCm target ${env:GPU_TARGET} was not recorded in CMakeCache.txt."
          }

      - name: Add ROCm launcher to package
        shell: pwsh
        run: Copy-Item ./scripts/Run-Rocm.ps1 ./build-rocm/bin/Run-Rocm.ps1

      - name: Create self-contained ROCm package
        shell: pwsh
        run: ./scripts/Package-RocmBuild.ps1 -BuildDir ./build-rocm -RocmRoot $env:HIP_PATH -RuntimeRoot $env:ROCM_PACKAGE_ROOT -Name "llama-${env:LLAMA_REF}-win-x64-rocm-${env:ROCM_VERSION}-${env:GPU_TARGET}-no-peer-copy"

      - name: Verify bundled ROCm runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem ./dist/*.zip)
          if ($archives.Count -ne 1) { throw "Expected one ROCm ZIP, found $($archives.Count)." }
          $archive = $archives[0]
          $testDir = Join-Path $env:RUNNER_TEMP 'llama-rocm-package-test'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $testDir
          $required = @('ggml-hip.dll', 'hipblas.dll', 'rocblas.dll', 'rocsolver.dll', 'Run-Rocm.ps1', 'ROCM-RUNTIME-FILES.txt')
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $testDir $_)) }
          if (-not (Get-ChildItem $testDir -Filter 'amdhip64*.dll' -File)) { $missing += 'amdhip64*.dll' }
          if (-not (Get-ChildItem $testDir -Filter 'amd_comgr*.dll' -File)) { $missing += 'amd_comgr*.dll' }
          $hasLegacyKernels = (Test-Path (Join-Path $testDir 'rocblas\library')) -and (Get-ChildItem (Join-Path $testDir 'rocblas\library') -Recurse -File)
          $hasKpackKernels = (Test-Path (Join-Path $testDir '.kpack')) -and (Get-ChildItem (Join-Path $testDir '.kpack') -Recurse -File -Filter '*.kpack')
          if (-not ($hasLegacyKernels -or $hasKpackKernels)) { $missing += 'ROCm device kernels (rocblas/library or .kpack)' }
          if (-not (Get-ChildItem (Join-Path $testDir 'licenses') -Recurse -File)) { $missing += 'licenses' }
          if ($missing) { throw "Bundled ROCm package verification failed: $($missing -join ', ')" }

      - name: Upload ROCm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llama-${{ env.LLAMA_REF }}-win-x64-rocm-${{ env.ROCM_VERSION }}-${{ env.GPU_TARGET }}-no-peer-copy
          path: dist/*.zip
          if-no-files-found: error

  vulkan:
    if: inputs.backend == 'all' || inputs.backend == 'vulkan'
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      llama_ref: ${{ steps.llama-source.outputs.ref }}
    steps:
      - name: Checkout with pinned llama.cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Select llama.cpp source
        id: llama-source
        shell: pwsh
        env:
          LLAMA_SOURCE: ${{ inputs.llama_source }}
          LLAMA_TAG: ${{ inputs.llama_tag }}
        run: |
          $tag = $env:LLAMA_TAG.Trim()
          switch ($env:LLAMA_SOURCE) {
            'release' {
              if ($tag) { ./scripts/Update-LlamaCpp.ps1 -Release $tag }
              else { ./scripts/Update-LlamaCpp.ps1 }
            }
            'nightly' {
              if ($tag) { ./scripts/Update-LlamaCpp.ps1 -Nightly $tag }
              else { ./scripts/Update-LlamaCpp.ps1 -LatestNightly }
            }
            'latest-branch' {
              if ($tag) { throw 'llama_tag must be empty when latest-branch is selected.' }
              ./scripts/Update-LlamaCpp.ps1 -LatestBranch
            }
            default { throw "Unsupported llama_source: $env:LLAMA_SOURCE" }
          }
          $selectedRef = git -C vendor/llama.cpp describe --tags --exact-match HEAD 2>$null
          if (-not $selectedRef) {
            $shortSha = git -C vendor/llama.cpp rev-parse --short=12 HEAD
            $selectedRef = "master-$shortSha"
          }
          "LLAMA_REF=$selectedRef" >> $env:GITHUB_ENV
          "ref=$selectedRef" >> $env:GITHUB_OUTPUT

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          $url = "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          curl.exe -fL -o $installer $url
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK download failed: $LASTEXITCODE" }
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installation failed: $LASTEXITCODE" }
          $sdkPath = "C:\VulkanSDK\${env:VULKAN_VERSION}"
          "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          "$sdkPath\bin" >> $env:GITHUB_PATH

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Build Vulkan
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S vendor/llama.cpp -B build-vulkan -G "Ninja Multi-Config" ^
            -DGGML_VULKAN=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON
          cmake --build build-vulkan --config Release -j %NUMBER_OF_PROCESSORS%

      - name: Verify Vulkan backend
        shell: pwsh
        run: |
          if (-not (Test-Path 'build-vulkan/bin/Release/ggml-vulkan.dll')) {
            throw 'ggml-vulkan.dll was not produced.'
          }
          if (-not (Select-String -Path 'build-vulkan/CMakeCache.txt' -Pattern '^GGML_VULKAN:BOOL=ON$')) {
            throw 'GGML_VULKAN=ON was not recorded in CMakeCache.txt.'
          }

      - name: Create Vulkan package
        shell: pwsh
        run: ./scripts/Package-Build.ps1 -BuildDir ./build-vulkan -Name "llama-${env:LLAMA_REF}-win-x64-vulkan-${env:VULKAN_VERSION}"

      - name: Upload Vulkan package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llama-${{ env.LLAMA_REF }}-win-x64-vulkan-${{ env.VULKAN_VERSION }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [cuda, rocm, vulkan]
    # Keep publishing limited to manual runs for now. If automatic llama.cpp
    # release detection is added later, extend this condition with an explicit
    # `new_release == true` output instead of allowing every scheduled run.
    # 現在は手動実行だけがReleaseを公開する。将来llama.cppの新リリースを
    # 自動検知する場合は、すべての定期実行を許可せず、`new_release == true`
    # のような新版検出結果をこの条件へ明示的に追加すること。
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_release &&
      !cancelled() &&
      (needs.cuda.result == 'success' || needs.rocm.result == 'success' || needs.vulkan.result == 'success') &&
      needs.cuda.result != 'failure' &&
      needs.rocm.result != 'failure' &&
      needs.vulkan.result != 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LLAMA_REF: ${{ needs.cuda.outputs.llama_ref || needs.rocm.outputs.llama_ref || needs.vulkan.outputs.llama_ref }}
      REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
      SELECTED_BACKEND: ${{ inputs.backend }}
      ROCM_TARGET: ${{ inputs.rocm_target }}
    steps:
      - name: Download successful build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release and attach ZIPs
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${REQUESTED_RELEASE_TAG//[[:space:]]/}"
          if [[ -z "$release_tag" ]]; then
            release_tag="build-${LLAMA_REF}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi

          shopt -s nullglob
          assets=(release-assets/*.zip)
          if (( ${#assets[@]} == 0 )); then
            echo 'No ZIP assets were downloaded.' >&2
            exit 1
          fi

          case "$SELECTED_BACKEND" in
            cuda)
              release_title="llama-${LLAMA_REF}-win-x64-cuda-${CUDA_VERSION}-no-peer-copy"
              release_notes="Windows x64 CUDA ${CUDA_VERSION} binaries built from llama.cpp ${LLAMA_REF}. Peer copy is disabled."
              ;;
            rocm)
              release_title="llama-${LLAMA_REF}-win-x64-rocm-${ROCM_VERSION}-${ROCM_TARGET}-no-peer-copy"
              release_notes="Windows x64 ROCm ${ROCM_VERSION} (${ROCM_TARGET}) binaries built from llama.cpp ${LLAMA_REF}. The ROCm runtime and device kernels are bundled; peer copy is disabled."
              ;;
            vulkan)
              release_title="llama-${LLAMA_REF}-win-x64-vulkan-${VULKAN_VERSION}"
              release_notes="Windows x64 Vulkan SDK ${VULKAN_VERSION} binaries built from llama.cpp ${LLAMA_REF}."
              ;;
            all)
              release_title="llama-${LLAMA_REF}-win-x64-gpu-cuda-${CUDA_VERSION}-rocm-${ROCM_VERSION}-${ROCM_TARGET}-vulkan-${VULKAN_VERSION}"
              release_notes="Windows x64 GPU binaries built from llama.cpp ${LLAMA_REF}. CUDA ${CUDA_VERSION}; ROCm ${ROCM_VERSION} (${ROCM_TARGET}, runtime and device kernels bundled); Vulkan SDK ${VULKAN_VERSION}. Peer copy is disabled in CUDA/ROCm builds."
              ;;
            *)
              echo "Unsupported backend for Release metadata: $SELECTED_BACKEND" >&2
              exit 1
              ;;
          esac

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}"
          else
            gh release create "$release_tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes "$release_notes"
          fi
